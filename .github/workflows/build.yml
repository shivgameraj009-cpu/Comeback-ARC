name: Build Comeback ARC APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare app files
        run: |
          mkdir -p www assets
          cp index.html www/index.html

      - name: Install packages
        run: |
          npm install
          npm install --no-save sharp

      - name: Make icon background
        run: node -e "require('sharp')({create:{width:1024,height:1024,channels:4,background:'#06080F'}}).png().toFile('assets/
