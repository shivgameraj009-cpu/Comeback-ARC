name: Build Comeback Arc APK v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare app files
        run: |
          mkdir -p www assets
          cp index.html www/index.html

      - name: Install packages
        run: |
          npm install
          npm install --no-save sharp

      - name: Make icons
        run: node make-icons.js

      - name: Build debug APK
        run: |
          npx cap add android
          npm run icons
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Check APK exists
        run: |
          ls -l android/app/build/outputs/apk/debug/
          cp android/app/build/outputs/apk/debug/app-debug.apk ComebackArc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: comeback-arc-apk
          path: ComebackArc.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: comebackarc-${{ github.run_number }}
          name: Comeback Arc build ${{ github.run_number }}
          files: ComebackArc.apk
