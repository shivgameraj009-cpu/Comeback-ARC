<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080F">
<style>html{color-scheme:dark;background:#06080F}body{margin:0}[hidden]{display:none!important}</style>
<title>Comeback Arc</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* Layout: one-hand phone HUD. Sticky player bar, content cards, bottom tab bar. Dark ink look, coral energy accent, gold XP, cyan focus. A silhouette whose shoulders widen with level is the signature visual. */
:root{
  --bg:#06080F;
  --panel:#0B1020;
  --panel2:#111832;
  --line:#1E2B52;
  --fg:#E6ECFF;
  --muted:#7C89B3;
  --coral:#4C8DFF;
  --coral-fg:#04112B;
  --gold:#D9B45A;
  --cyan:#5FE0FF;
  --good:#3FD0A0;
  --glow:rgba(76,141,255,.55);
  --font-display:"Rajdhani","Noto Sans",system-ui,sans-serif;
  --font-body:"Noto Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.disp{font-family:var(--font-display);font-weight:700;letter-spacing:.02em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.brand svg{width:22px;height:22px}
.chip-s{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:3px;border:1px solid var(--line);background:var(--panel);font-family:var(--font-display);font-weight:700;font-size:16px}
.chip-s .ic{width:16px;height:16px}
.chip-s.fire{color:#FF8A5C}
.chip-s.lv{color:var(--gold)}

/* cards */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:4px;padding:16px;box-shadow:inset 0 1px 0 rgba(95,224,255,.12),0 0 24px rgba(76,141,255,.06);position:relative}
.card::before{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;border-left:2px solid var(--cyan);border-top:2px solid var(--cyan);pointer-events:none}
.stack{display:flex;flex-direction:column;gap:14px;padding-block:6px 8px}
.h2{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
.h2::before{content:"[ ";opacity:.6}.h2::after{content:" ]";opacity:.6}
.muted{color:var(--muted)}
.small{font-size:13px}

/* player card */
.player{display:flex;gap:14px;align-items:center;position:relative;overflow:hidden;
  background:radial-gradient(120px 140px at 14% 50%,rgba(76,141,255,.22),transparent 70%),linear-gradient(180deg,var(--panel2),var(--panel))}
.player .sil{width:96px;flex:none;filter:drop-shadow(0 0 8px var(--glow))}
.hero-sil svg{filter:drop-shadow(0 0 12px var(--glow))}
.pinfo{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.pname{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:26px;padding:0 8px;border:1.5px solid var(--gold);color:var(--gold);font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.1em;text-shadow:0 0 8px rgba(217,180,90,.6)}
.xp{height:8px;background:#0A0F20;border:1px solid var(--line);border-radius:1px;overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#2A6BFF,var(--cyan));box-shadow:0 0 10px rgba(95,224,255,.6);width:0;transition:width .5s}
.row2{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.row2 b{color:var(--fg);font-weight:600}

/* quote */
.quote{padding:14px 16px 14px 18px;border-left:2px solid var(--cyan)}.quote::before{display:none}
.quote p{font-size:15px;max-width:60ch}
.quote span{display:block;margin-top:4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* quest list */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{flex:none;height:34px;padding:0 14px;border-radius:3px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(95,224,255,.25)}
.quest{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:4px;width:100%;text-align:left}
.quest .box{width:28px;height:28px;border-radius:3px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.quest .box .ic{width:18px;height:18px;opacity:0}
.quest[aria-pressed="true"]{background:var(--panel2);border-color:rgba(63,208,160,.4)}
.quest[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#04200F}
.quest[aria-pressed="true"] .box .ic{opacity:1}
.quest[aria-pressed="true"] .qt{text-decoration:line-through;color:var(--muted)}
.qm{min-width:0;flex:1}
.qt{font-weight:600;line-height:1.3}
.cat{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.cat.body{color:#7FB0FF}.cat.study{color:var(--cyan)}.cat.glow{color:var(--gold)}
.qx{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--gold);flex:none}
.list{display:flex;flex-direction:column;gap:8px}

/* buttons, forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:3px;font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.btn.pri{background:var(--coral);color:var(--coral-fg);box-shadow:0 0 18px rgba(76,141,255,.45)}
.btn.sec{background:var(--panel2);color:var(--fg)}
.btn.ghost{border:1.5px solid var(--line)}
.btn.danger{background:#3A1219;color:#FFB9C2;border:1px solid #7A2230}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{height:46px;border-radius:3px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;width:100%;min-width:0;font-size:16px}
.rowf{display:flex;gap:8px;flex-wrap:wrap}
.rowf>*{min-width:0}
.rowf .grow{flex:1 1 140px}

/* focus */
.ring{position:relative;width:min(72vw,280px);aspect-ratio:1;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:clamp(48px,16vw,72px);line-height:1;font-variant-numeric:tabular-nums}
.ring .time small{font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px;font-family:var(--font-body)}
.presets{display:flex;gap:8px;justify-content:center}
.pset{height:38px;padding:0 16px;border-radius:3px;border:1px solid var(--line);background:var(--panel);font-weight:700;letter-spacing:.08em;color:var(--muted)}
.pset.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(95,224,255,.25)}
.center{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* progress */

.hero-sil{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.hero-sil svg{width:170px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 10px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar i{display:block;width:100%;background:linear-gradient(var(--cyan),#2A6BFF);border-radius:1px;min-height:3px;box-shadow:0 0 8px rgba(95,224,255,.35)}
.bar span{font-size:11px;color:var(--muted)}
.bar.today span{color:var(--fg);font-weight:700}
.ladder{display:flex;gap:6px;flex-wrap:wrap}
.ladder div{flex:1 1 56px;text-align:center;padding:8px 4px;border-radius:3px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted)}
.ladder div b{display:block;font-family:var(--font-display);font-size:20px;color:var(--fg)}
.ladder div.on{border-color:var(--gold);box-shadow:0 0 12px rgba(217,180,90,.3)}

/* reminders */
.rem{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:3px}
.rem .tm{font-family:var(--font-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.rem .lb{flex:1;min-width:0;overflow-wrap:anywhere}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .2s}
.sw[aria-pressed="true"]{background:var(--good)}
.sw[aria-pressed="true"]::after{transform:translateX(18px)}
.del{width:34px;height:34px;border-radius:50%;background:var(--panel);display:inline-flex;align-items:center;justify-content:center;flex:none}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(6,8,15,.96);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);min-width:0}
.tab[aria-current="page"]{color:var(--cyan);text-shadow:0 0 10px rgba(95,224,255,.6)}

/* overlays */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:30;max-width:calc(100% - 32px);background:#0B1020;color:var(--fg);border:1px solid var(--cyan);padding:10px 18px;border-radius:3px;font-weight:700;letter-spacing:.04em;display:flex;gap:10px;align-items:center;box-shadow:0 0 24px rgba(95,224,255,.35)}
.toast.lvl{border-color:var(--gold);color:var(--gold);font-family:var(--font-display);font-size:22px;letter-spacing:.2em;text-transform:uppercase;box-shadow:0 0 30px rgba(217,180,90,.4)}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(5,7,14,.88);display:flex;justify-content:center;padding:16px;overflow-y:auto}
.panel{margin:auto;background:var(--panel);border:1px solid var(--cyan);box-shadow:0 0 40px rgba(76,141,255,.3);border-radius:4px;padding:22px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px}

 .boss{display:flex;flex-direction:column;gap:10px;border-color:rgba(217,180,90,.45)}
.boss .bn{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
.boss .hp{height:10px;background:#0A0F20;border:1px solid var(--line);overflow:hidden}
.boss .hp i{display:block;height:100%;background:linear-gradient(90deg,#8A2433,#FF5C70);box-shadow:0 0 10px rgba(255,92,112,.5)}
.goal{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.goal b{color:var(--fg);font-variant-numeric:tabular-nums}
.goal.ok b{color:var(--good)}
.title-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--panel);width:100%;text-align:left}
.title-row.lock{opacity:.5}
.title-row.eq{border-color:var(--gold);box-shadow:0 0 12px rgba(217,180,90,.25)}
.title-row .tn{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.title-row .td{font-size:12px;color:var(--muted)}
.title-row .ts{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);flex:none}
.exrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border:0}
.exrow b{font-weight:600}.exrow span{color:var(--cyan);font-family:var(--font-display);font-weight:700;font-size:17px;white-space:nowrap}
.logr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.logr:last-child{border:0}
.logr .lm{flex:1;min-width:0;overflow-wrap:anywhere}
.logr .ld{font-size:12px;color:var(--muted)}
.chart{width:100%;height:120px;display:block}
.archb.on{border-color:var(--cyan);box-shadow:0 0 14px var(--glow)}
.avatar{position:relative;flex:none;aspect-ratio:1;border:2px solid var(--line);overflow:hidden;background:#0A0F20}
.avatar>svg,.avatar>img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .6s}
.avlv{position:absolute;left:0;right:0;bottom:0;text-align:center;font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.18em;background:rgba(6,8,15,.82);color:var(--fg);padding:2px 0}
.avatar::after{content:"";position:absolute;inset:0;pointer-events:none}
.st1>img,.st1>svg{filter:grayscale(.8) brightness(.72)}
.st2{border-color:var(--cyan);box-shadow:0 0 14px var(--glow)}
.st2>img,.st2>svg{filter:grayscale(.2)}
.st3{border-color:var(--cyan);box-shadow:0 0 24px var(--glow),0 0 50px var(--glow)}
.st3>img,.st3>svg{filter:saturate(1.2) contrast(1.05)}
.st3::after{box-shadow:inset 0 0 22px var(--glow);animation:pulse 2.4s ease-in-out infinite alternate}
.st4{border-color:var(--gold);box-shadow:0 0 26px rgba(217,180,90,.75),0 0 60px var(--glow)}
.st4>img,.st4>svg{filter:saturate(1.3) contrast(1.08)}
.st4::after{box-shadow:inset 0 0 26px rgba(217,180,90,.85);animation:pulse 1.8s ease-in-out infinite alternate}
.st4 .avlv{color:var(--gold)}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
.fig{position:relative;flex:none;overflow:hidden;border:2px solid var(--line);background:#0A0F20;box-sizing:border-box}
.fig .huew{display:flex}
.fig .huew img{display:block;width:100%;height:auto;flex:1;min-width:0}
.fig .figlv{position:absolute;left:0;right:0;bottom:0;text-align:center;font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.18em;background:rgba(6,8,15,.82);color:var(--fg);padding:2px 0}
.fig.s1 .huew{filter:grayscale(.85) brightness(.7)!important}
.fig.s2{border-color:var(--cyan);box-shadow:0 0 14px var(--glow)}
.fig.s3{border-color:var(--cyan);box-shadow:0 0 24px var(--glow),0 0 50px var(--glow)}
.fig.s4{border-color:var(--gold);box-shadow:0 0 26px rgba(217,180,90,.75),0 0 60px var(--glow);animation:figpulse 1.9s ease-in-out infinite alternate}
.fig.s4 .figlv{color:var(--gold)}
@keyframes figpulse{from{box-shadow:0 0 14px rgba(217,180,90,.5),0 0 30px var(--glow)}to{box-shadow:0 0 28px rgba(217,180,90,.9),0 0 60px var(--glow)}}
@media (prefers-reduced-motion:reduce){.fig.s4{animation:none}}
@media (prefers-reduced-motion:reduce){.avatar::after{animation:none!important}}
@media (prefers-reduced-motion:reduce){.xp i,.sw::after{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 5h8l5 14 5-14h8L19 28h-6z" fill="none" stroke="#5FE0FF" stroke-width="2" stroke-linejoin="round"/></svg>
      Comeback Arc
    </div>
    <span class="chip-s fire" id="chip-streak"></span>
    <span class="chip-s lv" id="chip-lv"></span>
  </header>
  <main id="app"></main>
</div>
<nav class="tabs" aria-label="Main"><div class="tabs-in" id="tabs"></div></nav>
<div id="overlay"></div>

<script>
(function(){
"use strict";

/* ---------- data ---------- */
var DEFAULT_QUESTS=[
 {id:"q1",t:"Strength session: push, pull or legs (30 min)",c:"body",x:40},
 {id:"q2",t:"Back and shoulders: rows, pulldowns, lateral raises",c:"body",x:30},
 {id:"q3",t:"Eat 3 proper meals with protein in each",c:"body",x:20},
 {id:"q4",t:"Drink 8 glasses of water",c:"body",x:10},
 {id:"q5",t:"Be in bed before 11:30 pm",c:"body",x:20},
 {id:"q6",t:"Revise today's notes (15 min)",c:"study",x:15},
 {id:"q7",t:"Phone in another room while studying",c:"study",x:15},
 {id:"q8",t:"Finish one focus session in the Focus tab",c:"study",x:25},
 {id:"q9",t:"10 minutes of morning sunlight",c:"glow",x:10},
 {id:"q10",t:"Face wash and basic skincare",c:"glow",x:10},
 {id:"q11",t:"Stand tall: posture check 3 times today",c:"glow",x:10},
 {id:"q12",t:"Write down one win from today",c:"glow",x:10}
];
var CAT={body:"Body",study:"Study",glow:"Glow-up"};
var QUOTES=[
 "You do not need a new body today. You need one rep.",
 "Small and daily beats big and once.",
 "Nobody sees the arc while it is being drawn. Keep drawing.",
 "Strong is built in the boring weeks.",
 "Show up tired. Show up anyway.",
 "A comeback starts with the next quest, not the perfect plan.",
 "Your only rival is yesterday's version of you.",
 "Eat enough. Sleep enough. Train well. Repeat.",
 "Progress is quiet. Consistency makes it loud.",
 "Low energy day? Do the smallest version of the quest.",
 "Respect the process and the mirror will catch up.",
 "Discipline is a skill. Skills level up.",
 "One focused hour beats five scattered ones.",
 "You are allowed to start from where you are.",
 "Streaks are built one tick at a time.",
 "Growth feels awkward before it feels good.",
 "Compare your Day 30 to your Day 1, not to anyone else.",
 "Rest is part of the plan, not a break from it.",
 "Do it badly. Then do it better.",
 "Your future self is watching what you do now.",
 "The boss level is the habit you keep.",
 "Strong shoulders start with showing up on pull day.",
 "Fuel the body you are building.",
 "Stand a little taller. It counts as a rep.",
 "Every expert once looked like they did not belong in the gym.",
 "Today's quest list is short. You can finish it.",
 "Be patient. Muscle takes months, not days.",
 "Quiet confidence is earned in private.",
 "Win the morning, then the day follows.",
 "Level up in silence. Let the results talk."
];
var RANKS=[["E",1],["D",5],["C",10],["B",15],["A",20],["S",30]];

/* ---------- storage ---------- */
var KEY="comebackarc.v1";
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function fresh(){
  return {name:"",welcomed:false,xp:0,quests:DEFAULT_QUESTS.map(function(q){return {id:q.id,t:q.t,c:q.c,x:q.x};}),days:{},focusMin:0,focusDone:0,logs:[],body:[],boss:{},unlocked:[],title:"",arch:"blade",insp:"",
    reminders:[{id:"r1",time:"07:30",label:"Water and 10 minutes of sunlight",on:true},{id:"r2",time:"17:00",label:"Training time",on:true},{id:"r3",time:"22:30",label:"Phone away, wind down",on:true}],fired:{}};
}
var S=fresh();
try{var raw=lsGet(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==="object"){S=Object.assign(fresh(),p);}}}catch(e){}
function save(){lsSet(KEY,JSON.stringify(S));}
var uid=function(){return "x"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);};

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function key(d){var y=d.getFullYear(),m=d.getMonth()+1,da=d.getDate();return y+"-"+(m<10?"0":"")+m+"-"+(da<10?"0":"")+da;}
function today(){return key(new Date());}
function dayRec(k){if(!S.days[k])S.days[k]={ids:[],xp:0,focus:0};return S.days[k];}
function levelInfo(xp){var lvl=1,need=100;while(xp>=need){xp-=need;lvl++;need+=25;}return {lvl:lvl,into:xp,need:need};}
function rankOf(l){var r="E";RANKS.forEach(function(x){if(l>=x[1])r=x[0];});return r;}
function qualifies(k){return S.days[k]&&S.days[k].ids.length>=3;}
function streak(){
  var d=new Date(),n=0;
  if(!qualifies(key(d)))d.setDate(d.getDate()-1);
  while(qualifies(key(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}

/* silhouette: shoulders widen with level, waist stays the same */
function sil(lvl){
  var A=archDef(),s=A.s0+Math.min(lvl-1,30)*A.gr,c=60,w=A.w;
  var torso="M"+(c-s)+" 58 Q"+(c-s)+" 49 "+(c-s+9)+" 48 L"+(c-6)+" 43 L"+(c+6)+" 43 L"+(c+s-9)+" 48 Q"+(c+s)+" 49 "+(c+s)+" 58 L"+(c+w+1)+" 100 L"+(c-w-1)+" 100 Z";
  var al="M"+(c-s-1)+" 58 L"+(c-s-8)+" 98 L"+(c-s)+" 100 L"+(c-s+8)+" 66 Z";
  var ar="M"+(c+s+1)+" 58 L"+(c+s+8)+" 98 L"+(c+s)+" 100 L"+(c+s-8)+" 66 Z";
  var ll="M"+(c-w-1)+" 100 L"+(c-1)+" 100 L"+(c-3)+" 154 L"+(c-12)+" 154 Z";
  var lr="M"+(c+1)+" 100 L"+(c+w+1)+" 100 L"+(c+12)+" 154 L"+(c+3)+" 154 Z";
  var st='fill="#0C1530" stroke="'+A.col+'" stroke-width="1.4" stroke-linejoin="round"';
  return '<svg viewBox="0 0 120 160" role="img" aria-label="Your form at level '+lvl+'">'+
   '<ellipse cx="60" cy="26" rx="10" ry="12" '+st+'/>'+

}

/* ---------- state for ui ---------- */
var UI={view:"quests",filter:"all"};
var toastTimer=null;
function toast(msg,cls){
  var o=document.getElementById("overlay");
  var old=o.querySelector(".toast");if(old)old.remove();
  var d=document.createElement("div");d.className="toast"+(cls?" "+cls:"");d.setAttribute("role","status");d.textContent=msg;
  o.appendChild(d);
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){d.remove();},cls==="lvl"?2600:2200);
}

/* ---------- xp ---------- */
function addXp(n,k){
  var before=levelInfo(S.xp).lvl;
  S.xp=Math.max(0,S.xp+n);
  dayRec(k||today()).xp=Math.max(0,dayRec(k||today()).xp+n);
  var after=levelInfo(S.xp).lvl;
  if(after>before){
    if(stageOf(after)>stageOf(before))toast("Evolved: "+STAGES[stageOf(after)][1],"lvl");
    else toast("Level up! "+after,"lvl");
  }
  return after>before;
}
function toggleQuest(id){
  var q=S.quests.filter(function(x){return x.id===id;})[0];if(!q)return;
  var d=dayRec(today()),i=d.ids.indexOf(id);
  if(i>-1){d.ids.splice(i,1);addXp(-q.x);}
  else{d.ids.push(id);var up=addXp(q.x);if(!up)toast("+"+q.x+" XP");
    if(d.ids.length===3&&!up)toast("Daily streak secured");}
  save();render();
}

  var li=levelInfo(S.xp),st=streak();

  document.getElementById("chip-lv").innerHTML="LV "+li.lvl;
}

/* focus timer */
var F={mins:25,running:false,endAt:0,left:25*60,tick:null};
function fmt(s){var m=Math.floor(s/60),r=s%60;return (m<10?"0":"")+m+":"+(r<10?"0":"")+r;}
function viewFocus(){
  var d=S.days[today()]||{focus:0};
  var total=F.mins*60,C=2*Math.PI*96,frac=F.left/total;
  return '<div class="stack"><section class="card" style="display:flex;flex-direction:column;gap:16px">'+
   '<h2 class="h2">Focus mode</h2>'+
   '<div class="presets" role="group">'+[15,25,45].map(function(m){return '<button class="pset'+(F.mins===m?' on':'')+'" type="button" data-mins="'+m+'"'+(F.running?' disabled':'')+'>'+m+' min</button>';}).join("")+'</div>'+
   '<div class="ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="none" stroke="#2A3354" stroke-width="8"/><circle id="ringfg" cx="100" cy="100" r="96" fill="none" stroke="#38D3F2" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-frac)).toFixed(1)+'"/></svg>'+
   '<div class="time"><span id="clock">'+fmt(F.left)+'</span><small>'+(F.running?'Locked in':'Standby')+'</small></div></div>'+
   '<div class="center">'+(F.running?'<button class="btn sec" type="button" id="fpause">Pause</button><button class="btn ghost" type="button" id="fstop">Give up</button>':'<button class="btn pri" type="button" id="fstart">'+ic("bolt")+(F.left<F.mins*60?'Resume':'Start')+'</button>'+(F.left<F.mins*60?'<button class="btn ghost" type="button" id="fstop">Reset</button>':''))+'</div>'+
   '<p class="small muted" style="text-align:center">Finish a session to earn XP equal to its minutes. Keep the app open while you focus.</p></section>'+
   '<div class="stats"><div class="stat"><b>'+(d.focus||0)+'</b><span>min today</span></div><div class="stat"><b>'+S.focusDone+'</b><span>sessions</span></div><div class="stat"><b>'+S.focusMin+'</b><span>min total</span></div></div></div>';
}
function syncFocus(){
  var left=Math.max(0,Math.ceil((F.endAt-Date.now())/1000));
  F.left=left;
  var c=document.getElementById("clock");if(c)c.textContent=fmt(left);
  var r=document.getElementById("ringfg");
  if(r){var C=2*Math.PI*96;r.setAttribute("stroke-dashoffset",(C*(1-left/(F.mins*60))).toFixed(1));}
  if(left<=0)focusDone();
}
function focusStart(){
  F.running=true;F.endAt=Date.now()+F.left*1000;
  clearInterval(F.tick);F.tick=setInterval(syncFocus,500);
  try{beepInit();}catch(e){}
  render();
}
function focusPause(){F.running=false;clearInterval(F.tick);syncFocus();render();}
function focusStop(){F.running=false;clearInterval(F.tick);F.left=F.mins*60;render();}
var actx=null;
function beepInit(){var A=window.AudioContext||window.webkitAudioContext;if(A&&!actx)actx=new A();}
function beep(){try{if(!actx)return;var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(actx.currentTime+.35);}catch(e){}}
function focusDone(){
  clearInterval(F.tick);F.running=false;
  var m=F.mins;
  dayRec(today()).focus+=m;S.focusMin+=m;S.focusDone+=1;
  var up=addXp(m);
  if(!up)toast("Focus complete +"+m+" XP");
  beep();try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
  F.left=F.mins*60;save();render();
}

function attrStats(){
  var t={body:0,study:0,glow:0};
  Object.keys(S.days).forEach(function(k){S.days[k].ids.forEach(function(id){var q=S.quests.filter(function(x){return x.id===id;})[0];if(q)t[q.c]+=q.x;});});
  var m=Math.max(100,t.body,t.study,t.glow);
  var rows=[["STR","body"],["INT","study"],["CHA","glow"]];
  return '<section class="card" style="display:flex;flex-direction:column;gap:12px"><h2 class="h2">Attributes</h2>'+rows.map(function(r){
    return '<div style="display:flex;align-items:center;gap:12px"><span class="disp" style="width:42px;font-size:18px;letter-spacing:.12em">'+r[0]+'</span><div class="xp" style="flex:1"><i style="width:'+Math.round(t[r[1]]/m*100)+'%"></i></div><span class="disp" style="width:44px;text-align:right;font-size:18px">'+t[r[1]]+'</span></div>';
  }).join("")+'<p class="small muted">STR = Body quests, INT = Study quests, CHA = Glow-up quests.</p></section>';
}
/* weeks, boss, titles */
function weekKey(){var x=new Date();x.setDate(x.getDate()-((x.getDay()+6)%7));return key(x);}
function weekDates(){var x=new Date(),a=[],i;x.setDate(x.getDate()-((x.getDay()+6)%7));for(i=0;i<7;i++){a.push(key(x));x.setDate(x.getDate()+1);}return a;}
function weekStats(){
  var tr=0,fo=0,qu=0;
  weekDates().forEach(function(k){
    var d=S.days[k],log=S.logs.some(function(l){return l.date===k;}),q1=d&&d.ids.indexOf("q1")>-1;
    if(log||q1)tr++;if(d){fo+=d.focus||0;qu+=d.ids.length;}
  });
  return {train:tr,focus:fo,quests:qu};
}
var BOSS_NAMES=["The Doubt","The Delay","The Slump","The Plateau"];
var BOSS_GOALS=[["train",3,"Training days"],["focus",120,"Focus minutes"],["quests",15,"Quests cleared"]];
function bossState(){
  var w=weekStats(),pct=0,all=true;
  BOSS_GOALS.forEach(function(g){var r=Math.min(1,w[g[0]]/g[1]);pct+=r/BOSS_GOALS.length;if(w[g[0]]<g[1])all=false;});
  var wk=weekKey();
  return {w:w,pct:Math.round(pct*100),all:all,done:!!S.boss[wk],name:BOSS_NAMES[Math.floor(Date.parse(wk)/6048e5)%BOSS_NAMES.length]};
}
function bossCard(){
  var b=bossState();
  return '<section class="card boss"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span class="h2" style="color:var(--gold)">Weekly boss</span><span class="small muted">Resets Monday</span></div>'+
   '<div class="bn">'+b.name+'</div>'+
   '<div class="hp" role="progressbar" aria-valuenow="'+(100-b.pct)+'" aria-valuemin="0" aria-valuemax="100" aria-label="Boss health"><i style="width:'+(b.done?0:100-b.pct)+'%"></i></div>'+
   BOSS_GOALS.map(function(g){var v=b.w[g[0]];return '<div class="goal'+(v>=g[1]?' ok':'')+'"><span>'+g[2]+'</span><b>'+Math.min(v,g[1])+' / '+g[1]+'</b></div>';}).join("")+
   (b.done?'<p class="small" style="color:var(--good);font-weight:700">Defeated this week. +100 XP claimed.</p>':b.all?'<button class="btn pri" type="button" id="claim">Defeat boss +100 XP</button>':'<p class="small muted">Hit all three goals to defeat it and claim 100 XP.</p>')+'</section>';
}
function bestStreak(){
  var ks=Object.keys(S.days).filter(qualifies).sort(),best=0,run=0,prev=null;
  ks.forEach(function(k){
    var d=new Date(k+"T00:00:00");
    if(prev){var p=new Date(prev+"T00:00:00");p.setDate(p.getDate()+1);run=(key(p)===k)?run+1:1;}else run=1;
    if(run>best)best=run;prev=k;
  });
  return best;
}
function metrics(){
  var q=0;Object.keys(S.days).forEach(function(k){q+=S.days[k].ids.length;});
  return {quests:q,best:Math.max(bestStreak(),streak()),sess:S.focusDone,fmin:S.focusMin,logs:S.logs.length,lvl:levelInfo(S.xp).lvl,boss:Object.keys(S.boss).length,body:S.body.length};
}

function titleName(){var t=TITLES.filter(function(x){return x.id===S.title;})[0];return t?t.n:"Rookie";}
function checkTitles(){
  var m=metrics(),fresh2=[];
  TITLES.forEach(function(t){if(t.f(m)&&S.unlocked.indexOf(t.id)<0){S.unlocked.push(t.id);fresh2.push(t.n);if(!S.title)S.title=t.id;}});
  if(fresh2.length){save();setTimeout(function(){toast("Title unlocked: "+fresh2[0],"lvl");},1400);}
}
function titlesCard(){
  return '<section class="card" style="display:flex;flex-direction:column;gap:10px"><h2 class="h2">Titles</h2><p class="small muted">Tap an unlocked title to equip it.</p><div class="list">'+TITLES.map(function(t){
    var un=S.unlocked.indexOf(t.id)>-1,eq=S.title===t.id;
    return '<button class="title-row'+(un?'':' lock')+(eq?' eq':'')+'" type="button" '+(un?'data-title="'+t.id+'"':'disabled')+'><span><span class="tn" style="display:block">'+t.n+'</span><span class="td">'+t.d+'</span></span><span class="ts">'+(eq?'Equipped':un?'Unlocked':'Locked')+'</span></button>';
  }).join("")+'</div></section>';
}

/* body tracker */
function bodyCard(){
  var b=S.body.slice().sort(function(a,c){return a.date<c.date?-1:1;}),last=b[b.length-1],first=b[0];
  var h='<section class="card" style="display:flex;flex-direction:column;gap:12px"><h2 class="h2">Body tracker</h2>';
  if(last){
    var ratio=(last.sh&&last.wa)?(last.sh/last.wa).toFixed(2):"-";
    var dw=(last.w&&first.w&&b.length>1)?((last.w-first.w)>0?"+":"")+(last.w-first.w).toFixed(1)+" kg":"-";
    h+='<div class="stats"><div class="stat"><b>'+(last.w||"-")+'</b><span>kg now</span></div><div class="stat"><b>'+ratio+'</b><span>shoulder / waist</span></div><div class="stat"><b>'+dw+'</b><span>since start</span></div></div>';
    var pts=b.filter(function(x){return x.w;}).slice(-12);
    if(pts.length>1){
      var mn=Math.min.apply(null,pts.map(function(x){return x.w;}))-1,mx=Math.max.apply(null,pts.map(function(x){return x.w;}))+1;
      var xy=pts.map(function(p,i){return (i/(pts.length-1)*280+10).toFixed(1)+","+(100-(p.w-mn)/(mx-mn)*90).toFixed(1);});
      h+='<svg class="chart" viewBox="0 0 300 110" preserveAspectRatio="none" role="img" aria-label="Weight trend"><polyline points="'+xy.join(" ")+'" fill="none" stroke="#5FE0FF" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+xy.map(function(p){var q=p.split(",");return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3" fill="#06080F" stroke="#5FE0FF" stroke-width="1.5" vector-effect="non-scaling-stroke"/>';}).join("")+'</svg>';
    }
  }else h+='<p class="small muted">No check-ins yet. Add your first one below. Weigh yourself once a week, same time of day.</p>';
  h+='<form id="addb" class="rowf" style="align-items:flex-end"><div class="field grow"><label for="bw">Weight (kg)</label><input id="bw" class="inp" type="number" inputmode="decimal" step="0.1" min="20" max="250" placeholder="55.0"></div>'+
   '<div class="field grow"><label for="bsh">Shoulders (cm)</label><input id="bsh" class="inp" type="number" inputmode="decimal" step="0.5" min="50" max="200" placeholder="102"></div>'+
   '<div class="field grow"><label for="bwa">Waist (cm)</label><input id="bwa" class="inp" type="number" inputmode="decimal" step="0.5" min="40" max="200" placeholder="74"></div>'+
   '<button class="btn sec" type="submit" style="width:100%">'+ic("plus")+'Save check-in</button></form>';
  if(b.length)h+='<div>'+b.slice(-5).reverse().map(function(x){return '<div class="logr"><div class="lm"><b>'+(x.w?x.w+' kg':'')+'</b><span class="ld"> '+x.date+(x.sh?' · shoulders '+x.sh:'')+(x.wa?' · waist '+x.wa:'')+'</span></div><button class="del" type="button" data-bd="'+x.date+'" aria-label="Delete check-in">'+ic("trash")+'</button></div>';}).join("")+'</div>';
  h+='<p class="small muted">Measure shoulders around the widest point. A wider shoulder-to-waist ratio is the V-taper. It comes from building the back and shoulders, so train for it and give it time. Track for progress, not to judge yourself.</p></section>';
  return h;
}

  var p=PLAN[UI.pd],names=[];PLAN.forEach(function(x){x.ex.forEach(function(e){names.push(e[0]);});});
  var recent=S.logs.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1);}).slice(0,10);
  return '<div class="stack"><section class="card" style="display:flex;flex-direction:column;gap:12px"><h2 class="h2">'+archDef().n+' plan</h2>'+
   '<div class="filters" role="group">'+PLAN.map(function(x,i){return '<button class="f'+(UI.pd===i?' on':'')+'" type="button" data-pd="'+i+'">'+x.d+'</button>';}).join("")+'</div>'+
   '<div><div class="disp" style="font-size:22px;text-transform:uppercase;letter-spacing:.06em">'+p.d+' day</div><p class="small muted">'+p.f+'</p></div>'+
   '<div>'+p.ex.map(function(e){return '<div class="exrow"><b>'+e[0]+'</b><span>'+e[1]+'</span></div>';}).join("")+'</div>'+
   '<p class="small muted">Train 3 days a week with a rest day in between. Warm up for 5 minutes. Pick a weight where the last 2 reps are hard but clean, and add a little weight or a rep each week. Bodyweight at home works too.</p></section>'+
   '<form class="card" id="addl" style="display:flex;flex-direction:column;gap:12px"><h2 class="h2">Log exercise</h2>'+
   '<div class="field"><label for="le">Exercise</label><input id="le" class="inp" type="text" list="exl" maxlength="40" placeholder="e.g. Lat pulldown" required autocomplete="off"><datalist id="exl">'+names.map(function(n){return '<option value="'+esc(n)+'">';}).join("")+'</datalist></div>'+
   '<div class="rowf"><div class="field grow"><label for="lw">Weight (kg)</label><input id="lw" class="inp" type="number" inputmode="decimal" step="0.5" min="0" max="500" placeholder="0 = bodyweight"></div>'+
   '<div class="field grow"><label for="ls">Sets</label><input id="ls" class="inp" type="number" inputmode="numeric" min="1" max="20" value="3" required></div>'+
   '<div class="field grow"><label for="lr">Reps</label><input id="lr" class="inp" type="number" inputmode="numeric" min="1" max="200" value="10" required></div></div>'+
   '<button class="btn pri" type="submit">'+ic("plus")+'Save set</button><p class="small muted">Your first log each day gives +20 XP and counts as a training day for the weekly boss.</p></form>'+
   '<section class="card" style="display:flex;flex-direction:column;gap:6px"><h2 class="h2" style="margin-bottom:4px">Recent log</h2>'+
   (recent.length?recent.map(function(l){return '<div class="logr"><div class="lm"><b>'+esc(l.ex)+'</b><div class="ld">'+l.date+' · '+l.sets+' x '+l.reps+(l.w?' @ '+l.w+' kg':' · bodyweight')+'</div></div><button class="del" type="button" data-ld="'+l.id+'" aria-label="Delete log">'+ic("trash")+'</button></div>';}).join(""):'<p class="small muted">Nothing logged yet.</p>')+'</section></div>';
}

/* progress */
function viewProgress(){
  var li=levelInfo(S.xp),rk=rankOf(li.lvl),qd=0;
  Object.keys(S.days).forEach(function(k){qd+=S.days[k].ids.length;});
  var days=[],i,max=1;
  for(i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=key(d),x=(S.days[k]&&S.days[k].xp)||0;if(x>max)max=x;days.push({k:k,x:x,l:["S","M","T","W","T","F","S"][d.getDay()],t:i===0});}
  return '<div class="stack"><section class="card hero-sil">'+fig(310,li.lvl,true)+'<div class="disp" style="font-size:28px">Level '+li.lvl+' <span class="rank" style="vertical-align:middle">'+rk+'</span></div><div class="disp" style="color:var(--cyan);letter-spacing:.2em;text-transform:uppercase;font-size:16px">'+archDef().n.replace("Coach ","")+' &middot; '+STAGES[stageOf(li.lvl)][1]+'</div><p class="small muted" style="max-width:38ch">'+(stageOf(li.lvl)<STAGES.length-1?'Next evolution: '+STAGES[stageOf(li.lvl)+1][1]+' at level '+STAGES[stageOf(li.lvl)+1][0]+'.':'Final form reached. Keep the streak alive.')+'</p></section>'+
   attrStats()+'<div class="stats"><div class="stat"><b>'+S.xp+'</b><span>total XP</span></div><div class="stat"><b>'+qd+'</b><span>quests done</span></div><div class="stat"><b>'+streak()+'</b><span>day streak</span></div></div>'+
   '<section class="card"><h2 class="h2" style="margin-bottom:6px">XP this week</h2><div class="bars">'+days.map(function(d){return '<div class="bar'+(d.t?' today':'')+'"><i style="height:'+Math.max(3,Math.round(d.x/max*100))+'%" title="'+d.x+' XP"></i><span>'+d.l+'</span></div>';}).join("")+'</div></section>'+
   '<section class="card"><h2 class="h2" style="margin-bottom:10px">Rank ladder</h2><div class="ladder">'+RANKS.map(function(r){return '<div class="'+(r[0]===rk?'on':'')+'"><b>'+r[0]+'</b>Lv '+r[1]+'+</div>';}).join("")+'</div></section>'+bodyCard()+titlesCard()+'</div>';
}

/* settings, reminders */
function viewSettings(){
  var h='<div class="stack"><section class="card" style="display:flex;flex-direction:column;gap:12px"><h2 class="h2">Profile</h2>'+
   '<div class="field"><label for="pn">Your name</label><input id="pn" class="inp" type="text" maxlength="20" value="'+esc(S.name)+'" placeholder="Hunter" autocomplete="off"></div></section>'+
   '<section class="card" style="display:flex;flex-direction:column;gap:12px"><h2 class="h2">Your type</h2><div class="field"><label for="ins">Your inspiration (optional)</label><input id="ins" class="inp" type="text" maxlength="30" value="'+esc(S.insp)+'" placeholder="Any hero or athlete you look up to" autocomplete="off"></div><p class="small muted">Sets your character look and your workout plan.</p>'+archPicker()+'</section>'+
   '<section class="card" style="display:flex;flex-direction:column;gap:12px"><h2 class="h2">Reminders</h2>'+
   '<div class="list">'+S.reminders.map(function(r){
      return '<div class="rem"><span class="tm">'+esc(r.time)+'</span><span class="lb">'+esc(r.label)+'</span><button class="sw" type="button" data-rt="'+r.id+'" aria-pressed="'+r.on+'" aria-label="Toggle reminder"></button><button class="del" type="button" data-rd="'+r.id+'" aria-label="Delete reminder">'+ic("trash")+'</button></div>';
   }).join("")+'</div>'+
   '<form id="addr" class="rowf" style="align-items:flex-end"><div class="field"><label for="rt">Time</label><input id="rt" class="inp" type="time" value="09:00" required style="width:130px"></div>'+
   '<div class="field grow"><label for="rl">Label</label><input id="rl" class="inp" type="text" maxlength="50" placeholder="e.g. Start the first quest" autocomplete="off" required></div>'+
   '<button class="btn sec" type="submit" style="width:100%">'+ic("plus")+'Add reminder</button></form>'+
   '<p class="small muted">Reminders show up inside the app while it is open. Phone notifications need a later update.</p></section>'+
   '<section class="card" style="display:flex;flex-direction:column;gap:10px"><h2 class="h2">Your quests</h2><div class="list">'+
   S.quests.map(function(q){return '<div class="rem"><span class="lb"><span class="cat '+q.c+'">'+CAT[q.c]+'</span><br>'+esc(q.t)+'</span><span class="qx">+'+q.x+'</span><button class="del" type="button" data-qd="'+q.id+'" aria-label="Delete quest">'+ic("trash")+'</button></div>';}).join("")+'</div></section>'+
   '<section class="card" style="display:flex;flex-direction:column;gap:10px"><h2 class="h2">Read this</h2><p class="small muted" style="max-width:60ch">Build slowly. Eat enough, sleep well, and train with good form. Muscle takes months, and no app changes your body in a week. Comeback Arc is a motivation tool, not medical advice. If you feel very low about your body or struggle with eating, talk to a doctor or someone you trust.</p></section>'+
   '<section class="card" style="display:flex;flex-direction:column;gap:10px"><h2 class="h2">Start over</h2><p class="small muted">Clears all XP, streaks and history on this phone.</p><button class="btn danger" type="button" id="reset">Reset everything</button></section></div>';
  return h;
}

/* ---------- render ---------- */
function render(){
  applyArch();
  var v=UI.view,html="";
  if(v==="quests")html=viewQuests();
  else if(v==="focus")html=viewFocus();
  else if(v==="train")html=viewTrain();
  else if(v==="progress")html=viewProgress();
  else html=viewSettings();
  var keep=document.activeElement&&document.activeElement.id;
  document.getElementById("app").innerHTML=html;
  var tabs=[["quests","Quests"],["train","Train"],["focus","Focus"],["progress","Progress"],["settings","Settings"]];
  document.getElementById("tabs").innerHTML=tabs.map(function(t){return '<button class="tab" type="button" data-tab="'+t[0]+'"'+(v===t[0]?' aria-current="page"':'')+'>'+ic(t[0])+'<span>'+t[1]+'</span></button>';}).join("");
  header();
  checkTitles();
  if(!S.welcomed)welcome();
}
function welcome(){
  var o=document.getElementById("overlay");
  if(o.querySelector(".scrim"))return;
  var d=document.createElement("div");d.className="scrim";
  d.innerHTML='<div class="panel" role="dialog" aria-modal="true" aria-labelledby="wt"><h1 class="disp" id="wt" style="font-size:30px;line-height:1.1;text-transform:uppercase">Comeback Arc: system online</h1>'+
   '<p class="muted">Daily quests. Real XP. Every rep, every focus hour and every early night raises your rank. Start at E and work your way up.</p>'+
   '<div class="field"><label for="wn">Player name</label><input id="wn" class="inp" type="text" maxlength="20" placeholder="Hunter" autocomplete="off"></div>'+
   '<div class="field"><label>Choose your type</label>'+archPicker()+'</div>'+
   '<button class="btn pri" type="button" id="wgo">Begin</button></div>';
  o.appendChild(d);
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab],[data-q],[data-filter],[data-mins],[data-rt],[data-rd],[data-qd],[data-arch],[data-pd],[data-ld],[data-bd],[data-title],#claim,#fstart,#fpause,#fstop,#reset,#wgo");
  if(!t)return;
  if(t.hasAttribute("data-tab")){var v=t.getAttribute("data-tab");if(location.hash==="#"+v){fromHash();}else{location.hash=v;}return;}
  if(t.hasAttribute("data-q")){toggleQuest(t.getAttribute("data-q"));return;}
  if(t.hasAttribute("data-filter")){UI.filter=t.getAttribute("data-filter");render();return;}
  if(t.hasAttribute("data-mins")){F.mins=+t.getAttribute("data-mins");F.left=F.mins*60;render();return;}
  if(t.hasAttribute("data-rt")){S.reminders.forEach(function(r){if(r.id===t.getAttribute("data-rt"))r.on=!r.on;});save();render();return;}
  if(t.hasAttribute("data-rd")){S.reminders=S.reminders.filter(function(r){return r.id!==t.getAttribute("data-rd");});save();render();return;}
  if(t.hasAttribute("data-qd")){S.quests=S.quests.filter(function(q){return q.id!==t.getAttribute("data-qd");});save();render();return;}
  if(t.hasAttribute("data-arch")){S.arch=t.getAttribute("data-arch");UI.pd=0;save();applyArch();var bs=document.querySelectorAll(".archb");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.toggle("on",bs[bi].getAttribute("data-arch")===S.arch);if(!document.querySelector("#overlay .scrim"))render();return;}
  if(t.hasAttribute("data-pd")){UI.pd=+t.getAttribute("data-pd");render();return;}
  if(t.hasAttribute("data-ld")){S.logs=S.logs.filter(function(l){return l.id!==t.getAttribute("data-ld");});save();render();return;}
  if(t.hasAttribute("data-bd")){S.body=S.body.filter(function(x){return x.date!==t.getAttribute("data-bd");});save();render();return;}
  if(t.hasAttribute("data-title")){S.title=t.getAttribute("data-title");save();render();return;}
  if(t.id==="claim"){var b=bossState();if(b.all&&!b.done){S.boss[weekKey()]=true;addXp(100);toast("Boss defeated +100 XP","lvl");save();render();}return;}
  if(t.id==="fstart"){focusStart();return;}
  if(t.id==="fpause"){focusPause();return;}
  if(t.id==="fstop"){focusStop();return;}
  if(t.id==="wgo"){var n=document.getElementById("wn");S.name=(n&&n.value.trim())||"Hunter";S.welcomed=true;save();var s=document.querySelector("#overlay .scrim");if(s)s.remove();render();return;}
  if(t.id==="reset"){
    if(t.getAttribute("data-sure")!=="1"){t.setAttribute("data-sure","1");t.textContent="Tap again to erase everything";setTimeout(function(){if(t.isConnected){t.removeAttribute("data-sure");t.textContent="Reset everything";}},4000);return;}
    S=fresh();S.welcomed=false;save();F.left=F.mins*60;F.running=false;clearInterval(F.tick);render();return;
  }
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="addq"){
    var t=document.getElementById("nq").value.trim();if(!t)return;
    S.quests.push({id:uid(),t:t,c:document.getElementById("nc").value,x:+document.getElementById("nx").value});
    save();render();toast("Quest added");
  }else if(e.target.id==="addl"){
    var ex=document.getElementById("le").value.trim();if(!ex)return;
    var w=parseFloat(document.getElementById("lw").value)||0,sets=parseInt(document.getElementById("ls").value,10)||1,reps=parseInt(document.getElementById("lr").value,10)||1,td=today();
    var first=!S.logs.some(function(l){return l.date===td;});
    S.logs.push({id:uid(),date:td,ex:ex.slice(0,40),w:w,sets:sets,reps:reps});
    var up=first?addXp(20):false;save();render();if(!up)toast(first?"Logged +20 XP":"Logged");
  }else if(e.target.id==="addb"){
    var bw=parseFloat(document.getElementById("bw").value)||0,bs=parseFloat(document.getElementById("bsh").value)||0,ba=parseFloat(document.getElementById("bwa").value)||0;
    if(!bw&&!bs&&!ba)return;
    S.body=S.body.filter(function(x){return x.date!==today();});
    S.body.push({date:today(),w:bw,sh:bs,wa:ba});save();render();toast("Check-in saved");
  }else if(e.target.id==="addr"){
    var tm=document.getElementById("rt").value,lb=document.getElementById("rl").value.trim();if(!tm||!lb)return;
    S.reminders.push({id:uid(),time:tm,label:lb,on:true});S.reminders.sort(function(a,b){return a.time<b.time?-1:1;});
    save();render();toast("Reminder added");
  }
});
document.addEventListener("input",function(e){
  if(e.target&&e.target.id==="ins"){S.insp=e.target.value.slice(0,30);save();return;}
  if(e.target&&e.target.id==="pn"){S.name=e.target.value.slice(0,20);save();header();}
});

/* reminders while the app is open */
setInterval(function(){
  var n=new Date(),hm=(n.getHours()<10?"0":"")+n.getHours()+":"+(n.getMinutes()<10?"0":"")+n.getMinutes(),k=today();
  S.reminders.forEach(function(r){
    if(r.on&&r.time===hm&&S.fired[r.id]!==k){S.fired[r.id]=k;save();toast("Reminder: "+r.label);try{if(navigator.vibrate)navigator.vibrate(150);}catch(e){}}
  });
},20000);

/* routing */
var VIEWS=["quests","train","focus","progress","settings"];
function fromHash(){
  var h=(location.hash||"").replace("#","");
  UI.view=VIEWS.indexOf(h)>-1?h:"quests";
  render();window.scrollTo(0,0);
}
window.addEventListener("hashchange",fromHash);
fromHash();
})();
</script>

</html>
